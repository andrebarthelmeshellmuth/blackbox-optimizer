name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 2.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3.4
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal objective function + bounds that reproduces the issue.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      render: shell
    validations:
      required: false
